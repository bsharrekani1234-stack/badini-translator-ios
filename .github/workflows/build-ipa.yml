name: Build iOS App
on: push: branches: [ main ]
jobs: build: runs-on: macos-latest steps: - name: Checkout code uses: actions/checkout@v3
  - name: Set up Node.js
    uses: actions/setup-node@v3
    with:
      node-version: 18

  - name: Install dependencies
    run: npm install

  - name: Build iOS project
    run: |
      npx cap sync ios
      cd ios/App
      xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build
